version: 2

models:
  - name: orders_clean
    description: "Cleaned orders table"

    columns:
      - name: order_id
        tests:
          - unique

      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('customers_clean')
                field: customer_id

      - name: product_id
        tests:
          - relationships:
              arguments:
                to: ref('products_clean')
                field: product_id
      
      - name: order_date
        tests:
          - not_null

      - name: market
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['US','EU','APAC']


  - name: customers_clean
    description: "Cleaned customer table"

    columns:
      - name: customer_id
        tests:
          - unique

      - name: market
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['US','EU','APAC']


  - name: products_clean
    description: "Cleaned product table"

    columns:
      - name: product_id
        tests:
          - unique

      - name: market
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['US','EU','APAC']