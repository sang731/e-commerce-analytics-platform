version: 2

models:
  - name: fct_sales
    description: "Fact table for sales analytics"

    columns:
      - name: net_sales
        tests:
          - not_null

  - name: mart_daily_sales_by_region
    description: "Daily aggregated sales by market"

    columns:
      - name: total_sales
        tests:
          - not_null

      - name: total_orders
        tests:
          - not_null

  - name: mart_top_10_customers
    description: "Top 10 customers based on total spend"

    columns:
      - name: total_spend
        tests:
          - not_null

      - name: rnk
        tests:
          - not_null

  - name: mart_product_performance
    description: "Performance of products by category and sub-category"

    columns:
      - name: total_units_sold
        tests:
          - not_null

      - name: revenue
        tests:
          - not_null

      - name: profit
        tests:
          - not_null

  - name: mart_customer_churn
    description: "Customer churn analysis based on inactivity"

    columns:
      - name: last_order_date
        tests:
          - not_null

      - name: days_inactive
        tests:
          - not_null

      - name: churn_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['active','churned']